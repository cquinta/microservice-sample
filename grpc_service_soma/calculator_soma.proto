syntax = "proto3";

// O serviço Calculator define a função RPC.
service Calculatoradd {
  // O método Sub recebe uma AddRequest e retorna uma AddResponse.
  rpc Add(AddRequest) returns (AddResponse) {}
}

// A mensagem de requisição contém os dois números a serem somados.
message AddRequest {
  int32 number1 = 1;
  int32 number2 = 2;
}

// A mensagem de resposta contém o resultado da soma.
message AddResponse {
  int32 result = 1;
}
