syntax = "proto3";

// O serviço Calculator define a função RPC.
service Calculatorsub {
  // O método Sub recebe uma SubRequest e retorna uma SubResponse.
  rpc Sub(SubRequest) returns (SubResponse) {}
}

// A mensagem de requisição contém os dois números a serem subtraidos.
message SubRequest {
  int32 number1 = 1;
  int32 number2 = 2;
}

// A mensagem de resposta contém o resultado da soma.
message SubResponse {
  int32 result = 1;
}
