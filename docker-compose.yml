services:

  otel-collector:
    image: otel/opentelemetry-collector-contrib
    container_name: otel-collector
    user: 0:0
    privileged: true
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./telemetry-platform-config/otel-collector-config.yml:/etc/otel-collector-config.yml
      - /proc:/hostfs/proc:ro
      - /sys:/hostfs/sys:ro
      - /:/hostfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      
    ports:
      - "4317:4317" # grpc
      - "4318:4318" # http
      - "8889:8889" # prometheus endpoint
    networks:
      - telemetry
    depends_on:
      - tempo
      - loki
      - prometheus

  tempo:
    image: grafana/tempo:2.7.2
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./telemetry-platform-config/tempo.yml:/etc/tempo.yaml
    ports:
      - "3200:3200"    
      - "4319:4317"    # otlp grpc
      
    networks:
      - telemetry

  prometheus:
    image: prom/prometheus:v3.3.0
    container_name: prometheus
    command: 
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./telemetry-platform-config/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - telemetry

  loki:
    image: grafana/loki:3.4.3
    container_name: loki
    command: ["--config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./telemetry-platform-config/loki-config.yml:/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    networks:
      - telemetry

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./telemetry-platform-config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yaml
    ports:
      - "3000:3000"
    networks:
      - telemetry
    
      
      
    
  msapi:
    build:
      context: ./msapi
    ports:
      - "8000:80"
    environment:
      - SUM_SERVICE_URL=http://mssum:80/sum
      - SUB_SERVICE_URL=http://mssub:80/sub
    networks:
      - telemetry
    depends_on:
      - otel-collector
      - mssum
      - mssub

  mssum:
    build:
      context: ./mssum
    ports:
      - "8002:80"
    networks:
      - telemetry
    depends_on:
      - otel-collector

  mssub:
    build:
      context: ./mssub
    ports:
      - "8001:80"
    networks:
      - telemetry
    depends_on:
      - otel-collector

networks:
  telemetry:
    driver: bridge

